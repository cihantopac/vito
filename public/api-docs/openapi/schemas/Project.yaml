type: object
properties:
  id:
    type: integer
    example: 1
  name:
    type: string
    example: 'my-project'
  is_starred:
    type: boolean
    description: Whether the authenticated user has starred this project.
    example: false
  role:
    type: string
    enum: ['user', 'admin', 'owner']
    nullable: true
    example: 'owner'
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  users:
    type: array
    items:
      $ref: './ProjectUser.yaml'
    nullable: true
